services:
  postgres:
    image: postgres:15-alpine
    container_name: avito_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - avito_network

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
    command: ["migrate", "-path", "/migrations", "-database", "${DATABASE_URL}", "up"]
    restart: on-failure
    networks:
      - avito_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: avito_backend
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: on-failure
    networks:
      - avito_network

  restaurant-demo:
    build:
      context: ./restaurant-demo
      dockerfile: Dockerfile
    container_name: avito_demo_restaurant
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CORE_API_URL: http://backend:8080
    restart: on-failure
    networks:
      - avito_network

networks:
  avito_network:
    driver: bridge

volumes:
  postgres_data: